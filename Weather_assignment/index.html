<!DOCTYPE html>
<html lang= "en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fetching Weather Data</title>
	<script src="script.js" defer></script>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<h1>Weather Data of Hamburg:</h1>
	<div class="rectangle">
		<div class="row">
			<h1 id="temperature">Loading temperature...</h1>
			<h1>°C</h1>
		</div>
		<div class="row_small">
			<p>The probability for rain is:</p>
			<p id="rain_probability">Loading rain probability...</p>
			<p>%</p>
		</div>
		<div class="row_small">
			<p>for the following coordinates:</p>
			<p id="latitude">Loading latitude...</p>
			<p>&</p>
			<p id="longitude">Loading longitude...</p>
		</div>
	</div>
</body>
</html>
